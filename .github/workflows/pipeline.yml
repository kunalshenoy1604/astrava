# Hourly ingestion for the Vercel Hobby plan (whose crons run at most daily).
# Disabled until Supabase is connected: uncomment `schedule`, then add a
# `CRON_SECRET` repository secret and a `SITE_URL` repository variable.
name: Hourly ingestion
on:
  # schedule:
  #   - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline
        run: |
          curl --fail --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/ingest"
